version: "2"
# Um bloco por domínio: cada um gera o seu pacote a partir do seu arquivo de queries.
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/ideas.sql
    gen:
      go:
        package: ideas
        out: internal/ideas
        sql_package: pgx/v5
        emit_pointers_for_null_types: true # coluna nula vira *string, que sai como null no JSON
        overrides:
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/auth.sql
    gen:
      go:
        package: auth
        out: internal/auth
        sql_package: pgx/v5
        emit_pointers_for_null_types: true # coluna nula vira *string, que sai como null no JSON
        overrides:
          - db_type: timestamptz
            go_type: time.Time
